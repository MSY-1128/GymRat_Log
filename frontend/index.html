<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2ee" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='10' fill='%230f110e'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23c8f169' stroke-width='3.5' stroke-dasharray='30 44' stroke-linecap='round' transform='rotate(-90 16 16)'/></svg>" />
    <title>FitLog</title>
    <script>
      // 저장된 테마를 그리기 전에 적용해 깜빡임을 막는다(값이 없거나 저장소가 막혀 있으면 시스템 설정).
      try {
        var t = localStorage.getItem('fitlog.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
