server:
  # 로그인 없는 단일 사용자 MVP: 기본은 로컬 루프백에만 바인딩한다.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # 로그인 세션(서버 메모리). 백엔드를 재시작하면 다시 로그인해야 한다.
      timeout: 7d
      cookie:
        name: FITLOG_SESSION
        http-only: true
        same-site: lax
        # HTTPS로 서비스할 때는 true로 바꾼다(로컬 http에서는 false여야 쿠키가 저장됨).
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: fitlog
  datasource:
    # 값은 환경변수로 명시 주입한다(scripts/run-backend.* 가 .env를 읽어 주입).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/fitlog}
    username: ${SPRING_DATASOURCE_USERNAME:fitlog}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

fitlog:
  seed:
    resource: classpath:seed/data.json
  mfds:
    # data.go.kr 식약처 식품영양성분DB Decoding 키. 비어 있으면 식약처 검색은 503(MFDS_NOT_CONFIGURED).
    service-key: ${MFDS_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo03
    connect-timeout: 5s
    read-timeout: 10s
  foodsafety:
    # 식품안전나라 오픈API 인증키(바코드 → 제품). 비어 있으면 바코드 조회만 503(FOODSAFETY_NOT_CONFIGURED).
    api-key: ${FOODSAFETY_API_KEY:}
    base-url: https://openapi.foodsafetykorea.go.kr/api
    connect-timeout: 5s
    read-timeout: 10s
