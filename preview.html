<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLog 화면 시안</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6ef;color:#214737;max-width:1050px;margin:auto;padding:28px}header{font-weight:800;font-size:28px;margin-bottom:45px}h1{font-size:34px}small,p{color:#63766b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border-radius:20px;padding:24px;border:1px solid #e0e7db}.hero{background:#235b45;color:white}.number{font-size:34px;font-weight:700;margin:14px 0}.forms{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}label{display:block;margin:14px 0}input,select,button{font:inherit;width:100%;padding:11px;border:1px solid #cad7c9;border-radius:9px;margin-top:6px}button{background:#235b45;color:white;cursor:pointer}li{margin:12px 0;line-height:1.7}li button{width:auto;font-size:12px;padding:3px 8px;margin-left:8px}ul{padding-left:18px}footer{font-size:13px;line-height:1.8;margin:28px 0}@media(max-width:700px){.grid,.forms{grid-template-columns:1fr}}</style><header>FitLog<span style="color:#93ad65">.</span></header><small id="date"></small><h1>오늘의 균형을 기록하세요</h1><p>식단과 움직임을 하나씩 기록해 보세요.</p><div class="grid"><section class="card hero">섭취 칼로리<div class="number" id="intake">0 kcal</div>오늘 먹은 음식의 합계</section><section class="card">목표까지 남은 칼로리<div class="number" id="remaining">2000 kcal</div><label>섭취 목표 (kcal)<input id="target" type="number" min="1" max="10000" value="2000"></label></section><section class="card">운동 소모 추정<div class="number" id="burn">0 kcal</div><span id="minutes">0</span>분 · 휴식 대사 포함</section></div><div class="forms"><section class="card"><h2>오늘의 식단</h2><form id="mealForm"><label>음식 · 100g 기준 샘플<select id="food"></select></label><label>섭취량 (g)<input id="grams" type="number" min="0.1" max="5000" step="0.1" value="100" required></label><button>식단 추가</button></form><ul id="meals"></ul><small id="macros"></small></section><section class="card"><h2>오늘의 움직임</h2><form id="workoutForm"><label>운동 · 샘플 MET<select id="exercise"></select></label><label>시간 (분)<input id="duration" type="number" min="1" max="1440" value="30" required></label><label>체중 (kg)<input id="weight" type="number" min="30" max="350" step="0.1" value="70" required></label><button>운동 추가</button></form><ul id="workouts"></ul></section></div><p id="status" role="status"></p><footer>독립 화면 시안 · 검증되지 않은 기능 확인용 샘플입니다. 실제 서버·DB에 연결되지 않으며 새로고침하면 기록이 초기화됩니다. 목표에 운동 칼로리를 자동 가산하지 않습니다. 계산은 참고용이며 의료적 판단을 대신하지 않습니다.</footer><script>const seed={"schemaVersion":1,"sampleOnly":true,"notice":"검증된 영양정보가 아닌 기능 확인용 예시입니다.","profileExample":{"age":30,"sexForFormula":"MALE","heightCm":175,"weightKg":70,"activityFactor":1.2,"dailyTargetKcal":2000},"foods":[{"id":1,"name":"현미밥","basisGrams":100,"kcal":150,"carbsG":32,"proteinG":3,"fatG":1,"source":"DEMO"},{"id":2,"name":"닭가슴살","basisGrams":100,"kcal":165,"carbsG":0,"proteinG":31,"fatG":3.6,"source":"DEMO"},{"id":3,"name":"바나나","basisGrams":100,"kcal":89,"carbsG":23,"proteinG":1.1,"fatG":0.3,"source":"DEMO"}],"exercises":[{"id":1,"name":"걷기","met":3.5,"source":"DEMO"},{"id":2,"name":"달리기","met":8,"source":"DEMO"},{"id":3,"name":"자전거","met":6,"source":"DEMO"}],"mealEntries":[],"exerciseEntries":[]};const $=id=>document.getElementById(id);let meals=[],workouts=[],nextId=1;$('date').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());for(const f of seed.foods){const o=document.createElement('option');o.value=f.id;o.textContent=f.name+' · '+f.kcal+' kcal';$('food').append(o)}for(const e of seed.exercises){const o=document.createElement('option');o.value=e.id;o.textContent=e.name;$('exercise').append(o)}function drawList(id,items,remove){$(id).replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent='아직 기록이 없어요.';$(id).append(li)}for(const x of items){const li=document.createElement('li'),b=document.createElement('button');li.append(document.createTextNode(x.name+' · '+(x.grams?x.grams+'g':x.minutes+'분')+' · '+Math.round(x.kcal)+' kcal'));b.textContent='삭제';b.setAttribute('aria-label',x.name+' 기록 삭제');b.onclick=()=>{if(confirm('이 기록을 삭제할까요?'))remove(x.id)};li.append(b);$(id).append(li)}}function render(){const intake=meals.reduce((a,x)=>a+x.kcal,0),burn=workouts.reduce((a,x)=>a+x.kcal,0),target=Number($('target').value);$('intake').textContent=Math.round(intake)+' kcal';$('burn').textContent=Math.round(burn)+' kcal';$('remaining').textContent=target>0?Math.round(target-intake)+' kcal':'미설정';$('minutes').textContent=workouts.reduce((a,x)=>a+x.minutes,0);$('macros').textContent=['carbsG','proteinG','fatG'].map((k,i)=>['탄수화물','단백질','지방'][i]+' '+meals.reduce((a,x)=>a+x[k],0).toFixed(1)+'g').join(' · ');drawList('meals',meals,id=>{meals=meals.filter(x=>x.id!==id);render()});drawList('workouts',workouts,id=>{workouts=workouts.filter(x=>x.id!==id);render()})}$('mealForm').onsubmit=e=>{e.preventDefault();const f=seed.foods.find(x=>x.id===Number($('food').value)),g=Number($('grams').value);if(!f||!Number.isFinite(g)||g<=0||g>5000)return;meals.push({id:nextId++,name:f.name,grams:g,...Object.fromEntries(['kcal','carbsG','proteinG','fatG'].map(k=>[k,f[k]*g/100]))});render();$('status').textContent='식단을 추가했어요.'};$('workoutForm').onsubmit=e=>{e.preventDefault();const x=seed.exercises.find(x=>x.id===Number($('exercise').value)),m=Number($('duration').value),w=Number($('weight').value);if(!x||!Number.isFinite(m)||!Number.isFinite(w)||m<1||m>1440||w<30||w>350)return;workouts.push({id:nextId++,name:x.name,minutes:m,kcal:x.met*3.5*w/200*m});render();$('status').textContent='운동을 추가했어요.'};$('target').oninput=render;render();</script></html>
